name: Gerar biblioteca de música (Suno)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install requests
      - env:
          SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}
        run: python -m ip.music
      - run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music && git commit -m "biblioteca de música dos Reels" && git push
