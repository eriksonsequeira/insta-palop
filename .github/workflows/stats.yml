name: Estatísticas

on:
  workflow_dispatch:

concurrency:
  group: ip-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m ip.main stats
      - name: Aprendizagens semanais (segundas) ou a pedido
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          [ "$(TZ=Europe/Lisbon date +%u)" = 1 ] || { echo "aprendizagens só às segundas"; exit 0; }
          npm install -g @anthropic-ai/claude-code
          python -m ip.main learn
      - run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json; [ -f aprendizagens.md ] && git add aprendizagens.md; git commit -m "estatísticas $(date -u +%F)" && bash scripts/push.sh || true
