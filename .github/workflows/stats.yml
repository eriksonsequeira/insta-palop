name: Estatísticas

on:
  schedule:
    - cron: "5 5 * * *"     # todos os dias ~05:05 Lisboa
  workflow_dispatch:

concurrency:
  group: ip-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m ip.main stats
      - run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json && git commit -m "estatísticas $(date -u +%F)" && git push || true
