name: Renovar token do Instagram

# O token de longa duração dura 60 dias; renova-se a cada ~3 semanas.
# Precisa do secret GH_PAT (token fine-grained com permissão "Secrets: read and write" neste repositório).
on:
  schedule:
    - cron: "0 5 1,21 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -m ip.main refresh-token)
          echo "::add-mask::$NEW"
          printf '%s' "$NEW" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Token renovado"
