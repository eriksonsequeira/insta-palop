name: Publicar Story

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "ID do post (media/<id>/story.jpg)"
        required: true

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_ID: ${{ inputs.post_id }}
        run: python -m ip.main story "$POST_ID"
