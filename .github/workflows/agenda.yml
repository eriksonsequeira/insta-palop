name: Agenda

# Única tarefa agendada: verifica de 15 em 15 min o que já devia ter saído e lança uma de cada vez.
# O agendador do GitHub quase nunca dispara, por isso cada execução espera ~14 min e volta a lançar-se a si própria
# (estafeta). O cron fica como reserva: se a estafeta parar, a próxima execução agendada recomeça-a.
# O grupo de concorrência guarda no máximo 1 execução em espera, por isso nunca se juntam duas estafetas.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: agenda
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ip.agenda
      - run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git diff --cached --quiet && exit 0
          git commit -m "agenda" -q
          for i in 1 2 3; do bash scripts/push.sh && break; sleep 5; done
      - name: Estafeta (lança a próxima verificação daqui a ~14 min)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run agenda.yml --ref main
