name: Agenda

# Única tarefa agendada: verifica de 15 em 15 min o que já devia ter saído e lança uma de cada vez.
# Também pode ser "acordada" por um despertador externo (workflow_dispatch), porque o agendador do GitHub atrasa.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: agenda
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ip.agenda
      - run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git diff --cached --quiet && exit 0
          git commit -m "agenda" -q
          for i in 1 2 3; do git pull -q --rebase && bash scripts/push.sh -q && break; sleep 5; done
