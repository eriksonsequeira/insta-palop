name: Reel diário

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post a transformar em Reel (vazio = último publicado sem Reel)"
        default: ""
      only_publish:
        description: "1 = só publicar um reel.mp4 já gerado"
        default: "0"
      dry_run:
        description: "1 = gerar sem publicar (fica como artefacto para ver)"
        default: "0"

concurrency:
  group: ip-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reel-studio/package-lock.json
      - name: Cache do modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -r requirements.txt && python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
          cd reel-studio && npm ci && npx remotion browser ensure
      - name: Criar Reel
        id: create
        if: inputs.only_publish != '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          python -m ip.main reel "$POST_ID"
          if [ "${{ inputs.dry_run }}" = "1" ]; then exit 0; fi
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media drafts state.json && git commit -m "novo reel" && git push
      - name: Guardar vídeo de teste
        if: inputs.dry_run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: reel-teste
          path: media/*/reel.mp4
      - name: Publicar Reel
        if: inputs.dry_run != '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PID: ${{ steps.create.outputs.post_id || inputs.post_id }}
        run: |
          python -m ip.main publish-reel "$PID"
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase && git add state.json && git commit -m "reel publicado $PID" && git push || true
      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create erro --color D73A4A 2>/dev/null || true
          gh issue create --label erro --title "Falha no Reel ($(date -u +%F\ %H:%M))" \
            --body "Ver registo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
