name: Reel diário

on:
  schedule:
    # 1 Reel/dia a partir do último post publicado (~13:30 Luanda · 11:30 Praia · 14:30 Maputo)
    - cron: "29 12 * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post a transformar em Reel (vazio = último publicado sem Reel)"
        default: ""
      only_publish:
        description: "1 = só publicar um reel.mp4 já gerado"
        default: "0"

concurrency:
  group: ip-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt && python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
      - name: Criar Reel
        id: create
        if: inputs.only_publish != '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_ID: ${{ inputs.post_id }}
        run: |
          python -m ip.main reel "$POST_ID"
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media state.json && git commit -m "novo reel" && git push
      - name: Publicar Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PID: ${{ steps.create.outputs.post_id || inputs.post_id }}
        run: |
          python -m ip.main publish-reel "$PID"
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase && git add state.json && git commit -m "reel publicado $PID" && git push || true
      - name: Avisar se falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create erro --color D73A4A 2>/dev/null || true
          gh issue create --label erro --title "Falha no Reel ($(date -u +%F\ %H:%M))" \
            --body "Ver registo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
