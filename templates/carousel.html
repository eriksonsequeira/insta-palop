<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E1A;
    --ink: #F4F1EA;
    --muted: #A3A9BC;
    --line: rgba(244, 241, 234, .08);
    --accent: __ACCENT__;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }
  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    padding: 96px 88px 150px;
    display: flex; flex-direction: column;
  }
  /* grelha subtil + brilho da cor do pilar */
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: radial-gradient(ellipse at 85% 10%, #000 0%, transparent 65%);
  }
  .slide::after {
    content: ""; position: absolute; width: 900px; height: 900px; right: -380px; top: -420px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent), transparent 65%);
    pointer-events: none;
  }
  .slide > * { position: relative; z-index: 1; }

  .chip {
    align-self: flex-start;
    font: 600 26px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); border: 2px solid var(--accent); border-radius: 999px; padding: 14px 26px;
  }
  h1 {
    font: 700 112px/1.02 "Space Grotesk", sans-serif; letter-spacing: -.035em;
    margin-top: auto; text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { font: 400 40px/1.35 Inter, sans-serif; color: var(--muted); margin-top: 40px; max-width: 860px; text-wrap: pretty; }
  .swipe { margin-top: 64px; font: 600 30px/1 Inter, sans-serif; color: var(--ink); display: flex; gap: 16px; align-items: center; }
  .swipe span { color: var(--accent); font-size: 40px; }

  .num { font: 700 30px/1 "Space Grotesk", sans-serif; color: var(--accent); letter-spacing: .08em; }
  h2 { font: 700 76px/1.06 "Space Grotesk", sans-serif; letter-spacing: -.03em; margin-top: 36px; text-wrap: balance; }
  .big {
    font: 700 190px/1 "Space Grotesk", sans-serif; letter-spacing: -.05em; color: var(--accent);
    margin-top: auto; margin-bottom: 8px;
  }
  .big.small { font-size: 120px; }
  .body { font: 400 41px/1.42 Inter, sans-serif; color: #D9DCE5; margin-top: 44px; text-wrap: pretty; }
  .content .body { margin-top: auto; }
  .content .big + .body { margin-top: 36px; }
  .content .body.solo { font-size: 47px; line-height: 1.4; color: var(--ink); }
  .bar { width: 96px; height: 8px; background: var(--accent); border-radius: 4px; margin-top: 40px; }

  .cta h2 { font-size: 92px; margin-top: auto; }
  .cta .actions { display: grid; gap: 22px; margin-top: 64px; }
  .cta .act { font: 500 38px/1.2 Inter, sans-serif; display: flex; gap: 22px; align-items: center; }
  .cta .act b { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 18px;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font: 700 32px/1 "Space Grotesk"; }

  .slide > footer {
    position: absolute; left: 88px; right: 88px; bottom: 64px; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    font: 600 28px/1 Inter, sans-serif; color: var(--muted);
  }
  footer .handle { color: var(--ink); }
  .progress { display: flex; gap: 10px; }
  .progress i { width: 34px; height: 6px; border-radius: 3px; background: rgba(244,241,234,.18); }
  .progress i.on { background: var(--accent); }
</style>
</head>
<body>
__SLIDES__
</body>
</html>
